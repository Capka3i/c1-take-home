<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; }
    #app { display: flex; height: 100vh; }
    #login { display: flex; height: 100vh; align-items: center; justify-content: center; }
    #login form { display: flex; flex-direction: column; gap: 10px; width: 260px; }
    #login h2 { margin: 0 0 4px; font-size: 18px; }
    #login input { padding: 10px; font-size: 15px; }
    #login button { padding: 10px; font-size: 15px; cursor: pointer; }
    #sidebar { width: 280px; border-right: 1px solid #ddd; overflow-y: auto; }
    #userbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
    #me { font-weight: 600; }
    #logout { font-size: 12px; cursor: pointer; }
    #sidebar header { display: flex; align-items: center; justify-content: space-between; padding: 12px; }
    #sidebar h2 { font-size: 13px; text-transform: uppercase; color: #888; margin: 0; }
    #newConv { font-size: 13px; cursor: pointer; }
    #conversations { list-style: none; margin: 0; padding: 0; }
    #conversations li { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
    #conversations li:hover { background: #f6f6f6; }
    #conversations li.active { background: #eef4ff; }
    .dot { color: #e5484d; font-size: 12px; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #title { padding: 12px; margin: 0; border-bottom: 1px solid #ddd; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { padding: 6px 0; }
    .result { padding: 10px 12px; margin-bottom: 8px; border: 1px solid #e6e6e6; border-radius: 6px; cursor: pointer; }
    .result:hover { background: #f6f6f6; border-color: #b9c7ff; }
    .result strong { display: block; color: #3355cc; font-size: 13px; margin-bottom: 3px; }
    .result .snippet { color: #333; }
    #typing { min-height: 18px; padding: 0 12px; font-size: 13px; color: #888; font-style: italic; }
    #composer { display: flex; border-top: 1px solid #ddd; padding: 8px; gap: 8px; }
    #text { flex: 1; padding: 8px; }
    #searchForm { padding: 0 12px 12px; }
    #search { width: 100%; box-sizing: border-box; padding: 6px 8px; }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm">
      <h2>Введіть нікнейм</h2>
      <input id="nick" autocomplete="off" placeholder="Нікнейм…" />
      <button>Увійти</button>
    </form>
  </div>

  <div id="app" style="display: none">
    <div id="sidebar">
      <div id="userbar">
        <span id="me"></span>
        <button id="logout">Вихід</button>
      </div>
      <header>
        <h2>Conversations</h2>
        <button id="newConv">+ New</button>
      </header>
      <form id="searchForm"><input id="search" autocomplete="off" placeholder="Search messages…" /></form>
      <ul id="conversations"></ul>
    </div>
    <div id="main">
      <h3 id="title">Pick a conversation</h3>
      <div id="messages"></div>
      <div id="typing"></div>
      <form id="composer">
        <input id="text" autocomplete="off" placeholder="Message…" />
        <button>Send</button>
      </form>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
